name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.24.0'

# Pipeline:
#   push / PR → ci (install → common build → typecheck → tests → OpenNext web build → wrangler --dry-run)
#   main push, after ci passes → supabase_deploy + cloudflare_deploy (in parallel)

jobs:
  ci:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common packages
        run: pnpm --filter="./packages/*" build

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build Cloudflare worker
        run: pnpm --filter=web build:cf
        env:
          # Public (browser-safe) variables, derived from repository secrets/vars.
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Validate worker bundle
        run: cd apps/web && pnpm exec wrangler deploy --dry-run

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennext-worker
          path: apps/web/.open-next
          retention-days: 7

  supabase_deploy:
    name: Deploy Supabase
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '2.114.0'

      - name: Push database migrations
        run: |
          VURL="postgresql://postgres.${{ vars.SUPABASE_PROJECT_ID }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-${{ vars.SUPABASE_PROJECT_REGION }}.pooler.supabase.com:6543/postgres"
          supabase db push --db-url "$VURL"

  cloudflare_deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: opennext-worker
          path: apps/web/.open-next

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy:cf
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'shop-platform' }}