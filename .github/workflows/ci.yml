name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.24.0'

# Pipeline:
#   push / PR → ci (install → common build → typecheck → tests)
#             → build (OpenNext worker + wrangler --dry-run + artifact upload)
#   main only → deploy (rebuilds worker from this commit, validates token, deploys)
#             → pages_proxy (publish a Pages project that 200-proxies the
#                            worker, so <project>.pages.dev serves the site)
#
# The deploy job builds its own bundle instead of relying on the GitHub
# cross-job artifact service (which has been flaky here), but still runs
# after `build` succeeds so broken code never deploys.
#
# Supabase migrations are NOT deployed by CI: they are applied manually
# in the Supabase SQL editor.

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common packages
        run: pnpm --filter="./packages/*" build

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build Cloudflare worker
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare worker
        run: pnpm --filter=web build:cf
        env:
          # Public (browser-safe) values only; no privileged Supabase keys here.
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Verify worker bundle
        run: |
          test -f .open-next/worker.js || { echo "::error::OpenNext build did not produce .open-next/worker.js"; exit 1; }
        working-directory: apps/web

      - name: Validate worker bundle
        run: pnpm exec wrangler deploy --dry-run
        working-directory: apps/web

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennext-worker
          path: apps/web/.open-next
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Verify required variables
        run: |
          [ -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::Missing 'CLOUDFLARE_ACCOUNT_ID' repository variable"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || { echo "::error::Missing 'CLOUDFLARE_API_TOKEN' repository secret"; exit 1; }
          [ -n "${{ vars.SUPABASE_PROJECT_ID }}" ] || { echo "::error::Missing 'SUPABASE_PROJECT_ID' repository variable"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare worker
        run: pnpm --filter=web build:cf
        env:
          # Public (browser-safe) values only; no privileged Supabase keys here.
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Verify worker bundle
        run: |
          test -f .open-next/worker.js || { echo "::error::OpenNext build did not produce .open-next/worker.js"; exit 1; }
        working-directory: apps/web

      - name: Validate Cloudflare token
        run: |
          if ! pnpm exec wrangler whoami; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or lacks 'Account > Worker Scripts > Edit' and 'Account Settings: Read' permissions."
            echo "::error::Fix the token (see README 'Required repository variables') and rerun the workflow."
            exit 1
          fi
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy:cf
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'chezeina' }}

  pages_proxy:
    name: Publish Pages proxy (pages.dev)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages project
        run: |
          PAGES_PROJECT="${CLOUDFLARE_PAGES_PROJECT:-chezeina}"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          JSON="Content-Type: application/json"
          curl -fsSL -X POST "$API" -H "$AUTH" -H "$JSON" \
            --data "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"main\"}" \
            -o /dev/null -w "create http=%{http_code}\n" || true
          curl -fsSL -X PATCH "$API/$PAGES_PROJECT" -H "$AUTH" -H "$JSON" \
            --data '{"production_branch":"main"}' | jq -r '"production_branch=" + (.result.production_branch // "?")'
          curl -fsSL "$API/$PAGES_PROJECT" -H "$AUTH" \
            | jq -r '"bound_domains=" + ((.result.domains // []) | join(","))'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'chezeina' }}

      - name: Publish Pages proxy (worker-based)
        run: |
          PAGES_PROJECT="${CLOUDFLARE_PAGES_PROJECT:-chezeina}"
          WORKER_NAME="${CLOUDFLARE_PROJECT_NAME:-chezeina}"
          SUBDOMAIN="$(curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -r '.result.subdomain')"
          WORKER_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          echo "proxy target: ${WORKER_URL}"
          mkdir -p /tmp/pages-proxy
          cat > /tmp/pages-proxy/_worker.js <<_PAGES_JS_
const WORKER_URL = "${WORKER_URL}";

export default {
  async fetch(request) {
    const url = new URL(request.url);
    const target = WORKER_URL + url.pathname + url.search;
    const headers = new Headers(request.headers);
    headers.delete("host");
    return fetch(target, {
      method: request.method,
      headers,
      body: ["GET", "HEAD"].includes(request.method) ? undefined : request.body,
    });
  },
};
_PAGES_JS_
          echo "--- _worker.js ---"
          cat /tmp/pages-proxy/_worker.js
          pnpm exec wrangler pages deploy /tmp/pages-proxy --project-name "$PAGES_PROJECT" --branch main
          echo "--- recent deployments ---"
          pnpm exec wrangler pages deployment list --project-name "$PAGES_PROJECT" | head -20
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'chezeina' }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'chezeina' }}

      - name: Smoke test chezeina.pages.dev
        run: |
          sleep 15
          PAGES_URL="https://${CLOUDFLARE_PAGES_PROJECT:-chezeina}.pages.dev/"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$PAGES_URL")"
          echo "::notice::$PAGES_URL -> HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::pages.dev is not serving the app (HTTP $code). Review the 'Publish Pages proxy' log above."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'chezeina' }}