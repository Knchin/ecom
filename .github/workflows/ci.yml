name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.24.0'

# Pipeline:
#   push / PR → ci (install → common build → typecheck → tests). Fast feedback only.
#   main push, after ci passes → cloudflare_deploy (build worker from this commit → deploy).
#
# Supabase migrations are NOT deployed by CI: they are applied manually
# in the Supabase SQL editor.

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common packages
        run: pnpm --filter="./packages/*" build

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  cloudflare_deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Verify required variables
        run: |
          [ -n "${{ vars.SUPABASE_PROJECT_ID }}" ] || { echo "::error::Missing 'SUPABASE_PROJECT_ID' repository variable"; exit 1; }
          [ -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::Missing 'CLOUDFLARE_ACCOUNT_ID' repository variable"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || { echo "::error::Missing 'CLOUDFLARE_API_TOKEN' repository secret"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare worker
        run: pnpm --filter=web build:cf
        env:
          # Public (browser-safe) values only; no privileged Supabase keys here.
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Validate worker bundle
        run: cd apps/web && pnpm exec wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy:cf
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'shop-platform' }}