# GitLab CI/CD for the Local Shop platform
#
# Source of truth for CI/CD. GitHub Actions has been removed.
#
# Pipeline DAG:
#
#   merge_request / push (any branch)
#        │
#        ▼
#   ┌─────────────┐
#   │   validate  │  install (frozen lockfile) → common packages build → typecheck → tests
#   └──────┬──────┘
#          ▼
#   ┌─────────────┐
#   │   web_build │  common packages build → OpenNext Cloudflare worker build → wrangler --dry-run
#   └──────┬──────┘
#          ▼
#   ┌───────────────┐               ┌──────────────────┐
#   │ supabase_deploy│ (main only)  │ cloudflare_deploy │ (main only)
#   └───────────────┘               └──────────────────┘
#
# Merge requests and feature branches only run validate + web_build.
# Production deployments happen exclusively on the `main` branch, after all
# build/test jobs have succeeded. Both deploy jobs run in parallel.
#
# Runner / image strategy
# -----------------------
# Everything runs on a standard Linux runner (no macOS runner is required:
# this project has no iOS / Kotlin / Xcode targets). The default shared runner
# is used; a Linux runner with ~4-8 GB RAM and network access is sufficient.
#
# Required GitLab CI/CD variables
# -------------------------------
# As masked/protected Variables (Settings → CI/CD → Variables):
#   CLOUDFLARE_API_TOKEN       Cloudflare API token with Workers Scripts edit access
#   SUPABASE_DB_PASSWORD       Database password for the SUPABASE_PROJECT_ID project
# As Variables (non-sensitive, environment/production as needed):
#   CLOUDFLARE_ACCOUNT_ID       Cloudflare account ID
#   CLOUDFLARE_PROJECT_NAME     Worker name (defaults to `shop-platform`)
#   SUPABASE_PROJECT_ID         Supabase project reference (e.g. the `abcd-...` slug)
#   SUPABASE_PROJECT_REGION     Pooler region, e.g. `us-east-1`
#   SUPABASE_ANON_KEY           Public anon key (browser-safe) used for the web build
#   SUPABASE_PUBLISHABLE_KEY    Public publishable key; preferred over SUPABASE_ANON_KEY
#                                 for the NEXT_PUBLIC_* build environment
#
#   SUPABASE_SECRET_KEY / SUPABASE_SERVICE_ROLE_SECRET (server-only service role) must
#   NEVER be passed to the web build so it can never reach the browser bundle.
#
# Optional (recommended for supabase CLI auth):
#   SUPABASE_ACCESS_TOKEN       Supabase personal access token
#
# The web build inlines two NEXT_PUBLIC_* values from the variables above:
#     NEXT_PUBLIC_SUPABASE_URL  = https://$SUPABASE_PROJECT_ID.supabase.co
#     NEXT_PUBLIC_SUPABASE_ANON_KEY = $SUPABASE_PUBLISHABLE_KEY or $SUPABASE_ANON_KEY

stages:
  - validate
  - build
  - deploy

variables:
  NODE_IMAGE: node:22-bookworm-slim
  PNPM_VERSION: "11.24.0"
  CLOUDFLARE_PROJECT_NAME: "shop-platform"

default:
  image: $NODE_IMAGE
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    # Pin per-runner pnpm store inside the cloned repo so it can be cached.
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store" --location global
    - pnpm --version
  # Cache node_modules per-branch (keyed on the lockfile) and the global pnpm
  # store (content-addressed, so it is shared safely across branches).
  cache:
    - key:
        files:
          - pnpm-lock.yaml
        prefix: $CI_COMMIT_REF_SLUG
      paths:
        - node_modules/
    - key: pnpm-store-global
      paths:
        - .pnpm-store/
  retry:
    max: 1

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Validate
# ---------------------------------------------------------------------------

validate:
  stage: validate
  interruptible: true
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter="./packages/*" build
    - pnpm typecheck
    - pnpm test

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

web_build:
  stage: build
  needs: [validate]
  interruptible: true
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter="./packages/*" build
    - >
      NEXT_PUBLIC_SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY="${SUPABASE_PUBLISHABLE_KEY:-$SUPABASE_ANON_KEY}"
      pnpm --filter=web build:cf
    - cd apps/web && pnpm exec wrangler deploy --dry-run
  artifacts:
    name: opennext-worker-$CI_COMMIT_SHORT_SHA
    paths:
      - apps/web/.open-next/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Deploy (main branch only)
# ---------------------------------------------------------------------------

supabase_deploy:
  stage: deploy
  needs:
    - validate
    - web_build
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    - pnpm install --frozen-lockfile
    - npm install -g supabase@2.114.0
    - supabase --version
    # Push pending migrations (idempotent; each migration runs once).
    - >
      supabase db push
      --db-url "postgresql://postgres.${SUPABASE_PROJECT_ID}:${SUPABASE_DB_PASSWORD}@aws-0-${SUPABASE_PROJECT_REGION}.pooler.supabase.com:6543/postgres"
    # Deploy Edge Functions if any exist.
    - |
      if [ -d "supabase/functions" ] && [ -n "$(ls -A supabase/functions)" ]; then
        SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" \
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --legacy-bundle
      else
        echo "No Edge Functions to deploy."
      fi

cloudflare_deploy:
  stage: deploy
  needs:
    - validate
    - web_build
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    - pnpm install --frozen-lockfile
    # Consumes the `.open-next/` artifact produced by `web_build`.
    - cd apps/web
    - export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN"
    - export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
    - export CLOUDFLARE_PROJECT_NAME="${CLOUDFLARE_PROJECT_NAME:-shop-platform}"
    - pnpm deploy:cf